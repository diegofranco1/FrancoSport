<!DOCTYPE html>
<html lang="es">
  <head>
     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Franco Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/" aria-label="Franco Sport, inicio"><h1>Franco Sport</h1></a>
        <div class="navbar-actions">
          <a class="btn-custom" href="/cart.html" aria-label="Ver carro de compras" title="Carro de compras"><i class="bi bi-cart3"></i></a>
          <a class="btn-custom" href="/profile.html" aria-label="Ver mi cuenta" title="Mi cuenta"><i class="bi bi-person"></i></a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/#catalogo">Camisetas de fútbol</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container auth-page">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="card profile-card">
            <div class="card-header bg-primary text-white text-center">
              <h1 class="h3 mb-0">Tu perfil</h1>
            </div>
            <div class="card-body">
              <p id="user-name" class="card-text">
                <strong>Nombre:</strong>
              </p>
              <p id="user-email" class="card-text">
                <strong>Correo electrónico:</strong>
              </p>
              <p id="user-wallet" class="card-text">
                <strong>Saldo de tu cuenta:</strong>
              </p>
            </div>
          </div>
        </div>
    </main>

      <script src="feedback.js" defer></script>
      <script src="profile.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p><i class="bi bi-c-circle"></i> 2026 FrancoSport. Todos los derechos reservados.</p>
  </footer>
  </body>
</html>
