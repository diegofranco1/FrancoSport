<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Detalle del producto | Franco Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/" aria-label="Franco Sport, inicio"><h1>Franco Sport</h1></a>
        <div class="navbar-actions">
          <a class="btn-custom" href="/cart.html" aria-label="Ver carro de compras" title="Carro de compras"><i class="bi bi-cart3"></i></a>
          <a class="btn-custom" href="/profile.html" aria-label="Ver mi cuenta" title="Mi cuenta"><i class="bi bi-person"></i></a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/#catalogo">Camisetas de fútbol</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container product-detail-page my-5">
      <a class="product-back-link" href="/#catalogo"><i class="bi bi-arrow-left"></i> Volver a camisetas</a>
      <p id="product-message" class="text-secondary mt-4" role="status">Cargando producto...</p>
      <article id="product-detail" class="product-detail-card" hidden>
        <div class="product-detail-image-wrap">
          <img id="product-image" class="product-detail-image" alt="">
        </div>
        <div class="product-detail-info">
          <span class="store-eyebrow"><i class="bi bi-tag"></i> Camiseta de fútbol</span>
          <h2 id="product-name" class="page-title"></h2>
          <p id="product-price" class="product-detail-price"></p>
          <p id="product-stock" class="product-detail-stock" aria-live="polite"></p>

          <form id="product-purchase-form">
            <fieldset class="mb-4">
              <legend class="form-label fw-bold">Selecciona una talla</legend>
              <div id="product-sizes" class="product-size-options"></div>
            </fieldset>
            <div class="product-quantity-row mb-4">
              <label class="form-label fw-bold mb-0" for="product-quantity">Unidades</label>
              <input class="form-control" id="product-quantity" name="quantity" type="number" value="1" min="1" required>
            </div>
            <button id="add-to-cart-button" class="btn btn-primary btn-lg w-100" type="submit">Agregar al carro</button>
          </form>
        </div>
      </article>
    </main>

    <script src="feedback.js"></script>
    <script src="product-detail.js"></script>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p><i class="bi bi-c-circle"></i> 2026 FrancoSport. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
