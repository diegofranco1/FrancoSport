<!DOCTYPE html>
<html lang="es">
  <head>
     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Franco Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/" aria-label="Franco Sport, inicio"><h1>Franco Sport</h1></a>
        <div class="navbar-actions">
          <a class="btn-custom" href="/cart.html" aria-label="Ver carro de compras" title="Carro de compras"><i class="bi bi-cart3"></i></a>
          <a class="btn-custom" href="/profile.html" aria-label="Ver mi cuenta" title="Mi cuenta"><i class="bi bi-person"></i></a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/#catalogo">Camisetas de fútbol</a></li>
          </ul>
        </div>
      </div>
    </nav>


    <div class="container my-5">
        <h1>Panel de Administración</h1>
        <h2>Ventas Totales: <span id="ventas-totales">$0.00</span></h2>

<h2 class="page-title mt-4">Productos actuales</h2>
<div class="table-responsive">
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Precio</th>
      <th>URL</th>
      <th>Unidades disponibles</th>
      <th>Actualizar Productos</th>
      <th>Eliminar Productos</th>
    </tr>
  </thead>
  <tbody id="productos-container">
  </tbody>
</table>
  </div>


      <div class="container">
        <div class="row my-2">
          <div class="col-3"></div>
          <div class="col-md-4">
            <h2 class="page-title">Crear producto</h2>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="row my-2">
          <div class="col-md-3"></div>
          <div class="col-md-6">
            <div class="card">
              <div class="card-body">
                <form id="crearProductoForm">
                  <div class="mb-3" style="margin-left: 20px; margin-right: 20px;">
                    <label for="nombreProducto" class="form-label">Nombre del producto</label>
                    <input type="text" class="form-control" id="nombreProducto" name="name" required>
                  </div>
                  <div class="mb-3" style="margin-left: 20px; margin-right: 20px;">
                    <label for="precioProducto" class="form-label">Precio del producto</label>
                    <input type="number" class="form-control" id="precioProducto" name="price" required>
                  </div>
                  <div class="mb-3" style="margin-left: 20px; margin-right: 20px;">
                    <label for="urlImagen" class="form-label">URL imagen</label>
                    <input type="url" class="form-control" id="urlImagen" name="url" required>
                  </div>
                  <div class="mb-3" style="margin-left: 20px; margin-right: 20px;">
                    <label for="stockProducto" class="form-label">Unidades disponibles</label>
                    <input type="number" class="form-control" id="stockProducto" name="stock" required>
                  </div>
                  <button type="submit" class="btn btn-primary" style="margin-left: 20px;">Crear producto</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-md-3"></div>
        </div>
      </div>


    </div>



    <script src="feedback.js"></script>
    <script src="admin.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p><i class="bi bi-c-circle"></i> 2026 FrancoSport. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
