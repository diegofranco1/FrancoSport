<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Confirmar correo | Franco Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/" aria-label="Franco Sport, inicio"><h1>Franco Sport</h1></a>
        <a class="btn btn-custom" href="/" aria-label="Volver al inicio"><i class="bi bi-house"></i></a>
      </div>
    </nav>
    <main class="container auth-page">
      <section class="card auth-card text-center">
        <div class="verify-icon"><i class="bi bi-envelope-check"></i></div>
        <h1 class="h2">Confirmar correo</h1>
        <p class="text-secondary" id="verification-message" role="status" aria-live="polite">Estamos verificando tu enlace...</p>
        <a class="btn btn-primary auth-submit" id="login-link" href="/login.html" hidden>Ir a iniciar sesión</a>
        <a class="btn btn-outline-primary auth-submit mt-2" href="/">Volver a la tienda</a>
      </section>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p><i class="bi bi-c-circle"></i> 2026 FrancoSport. Todos los derechos reservados.</p>
    </footer>
    <script src="verify-email.js"></script>
  </body>
</html>
